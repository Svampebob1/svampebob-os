name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # JOB 1: Kjører kompileringen og lager RPM-en
  build-squeekboard:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45

    steps:
      - name: Hent repository
        uses: actions/checkout@v6

      - name: Kompiler squeekboard og lag RPM
        run: bash .github/scripts/build-squeekboard-rpm.sh

      - name: Lagre RPM som artifact
        uses: actions/upload-artifact@v7
        with:
          name: squeekboard-rpm
          path: /tmp/rpms/squeekboard-custom.rpm
          if-no-files-found: error
          retention-days: 7

  bluebuild:
    name: Build Custom Image
    needs: build-squeekboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe-bluefin.yml
          - recipe-bazzite.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Hent repository
        uses: actions/checkout@v6

      - name: Hent RPM fra byggjobben
        uses: actions/download-artifact@v7
        with:
          name: squeekboard-rpm
          path: files/dnf

      - name: Kontroller at RPM-en finnes
        run: test -s files/dnf/squeekboard-custom.rpm

      - name: Build Custom Image
        uses: blue-build/github-action@v1.14
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
          # Behold vår eksisterende checkout og den nedlastede RPM-en.
          skip_checkout: true
